# DB 접속 정보. PostgreSQL(계정 생성)과 PostgREST(접속)가 함께 참조합니다.
# 과제 재현을 위한 실습용 값입니다. 실제 서비스에서는 Git에 올리지 않습니다.
apiVersion: v1
kind: Secret
metadata:
  name: cloud-map-db-secret
  labels:
    app.kubernetes.io/part-of: cloud-map
type: Opaque
stringData:
  POSTGRESQL_USER: cloudmap
  POSTGRESQL_PASSWORD: CloudMapDemo2026
  POSTGRESQL_DATABASE: cloudmap
