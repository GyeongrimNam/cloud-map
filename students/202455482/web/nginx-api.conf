# UBI nginx 기본 server(8080) 안에 포함되는 설정입니다.
# 브라우저의 /api/ 요청을 PostgREST Service로 전달합니다(같은 주소라서 CORS 설정이 필요 없음).
location /api/ {
    proxy_pass http://cloud-map-api:3000/;
    proxy_set_header Host $host;
}

# DB 변경이 새로 고침 즉시 보이도록 화면 파일을 캐시하지 않습니다.
location = /index.html {
    add_header Cache-Control "no-store";
}
